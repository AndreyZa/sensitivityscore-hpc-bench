# Третий проход фазы P3: ДВА плеча размещения при работающем контроллере
# гашения. Отвечает на единственный вопрос, который первые два прохода
# оставили открытым: нужен ли энергоосознанный планировщик, если узлы
# всё равно можно выключать, — или довольно любой упаковки с гашением.
#
# ПОЧЕМУ ОТДЕЛЬНЫЙ ПРОХОД, А НЕ СРАВНЕНИЕ С УЖЕ СНЯТЫМ peaks-gash. Оба
# плеча идут ВНУТРИ одного прохода, чередуясь по повторениям, поэтому
# сравнение политик размещения при гашении получается парным и по потоку
# задач, и по времени: дрейф стенда входит в оба плеча одинаково. Сравнение
# с утренним peaks-gash было бы парным только по потоку — между проходами
# три часа, и разделить эффект политики и дрейф было бы нечем.
#
# Цена: 16 плеч вместо 8, около шести часов. Плечо peaks-gash при этом
# снимается заново, и это не расточительство, а условие парности.

extends: config-prod-p3-energy.yaml

scheduler_variants:
  - peaks-gash
  - packing-gash

output:
  results_dir: "results"
  results_file: "results-prod-p3-energy-pair.parquet"
  baselines_file: "baselines-prod-p3-energy.parquet"
