# Второй проход фазы P3: те же нагрузка, дозы и сценарий, но плечи идут
# при РАБОТАЮЩЕМ контроллере гашения (scripts/power-save.py). Всё, кроме
# двух ключей ниже, наследуется — определение сценария существует в одном
# месте, расходиться нечему.
#
# Отдельный файл результатов обязателен: харнесс переписывает results с
# нуля на каждом прогоне, и второй проход затёр бы первый. Оба файла
# грузятся в ClickHouse под ОДНОЙ меткой p3-energy, поэтому плечи всех
# трёх видов оказываются в одной таблице и сравниваются штатно.

extends: config-prod-p3-energy.yaml

# Плечо ОДНО. Изначально их было два — peaks-gash и packing-gash, чтобы
# ответить на вопрос §8 «нужен ли энергоосознанный планировщик или хватит
# любой упаковки с гашением». P2 этот вопрос уже закрыла: при всех
# включённых узлах разность между политиками размещения не отличима от
# нуля (максимум 1,8 % при интервале, накрывающем ноль). Второе плечо
# повторило бы то же измерение под другим именем и стоило бы 2,5 часа
# стенда — их лучше потратить на свип порога, который даёт правило
# эксплуатации, а не подтверждение уже известного.
scheduler_variants:
  - peaks-gash

output:
  results_dir: "results"
  results_file: "results-prod-p3-energy-gash.parquet"
  baselines_file: "baselines-prod-p3-energy.parquet"
