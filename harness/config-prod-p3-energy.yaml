# config-prod-p3-energy.yaml — фаза P3 энергостатьи: полный цикл с
# гашением. Главный результат ветки; P2 меряла размещение при всех
# включённых узлах, здесь добавляется выключение освобождённых.
#
# ТРИ ПЛЕЧА (§8 статьи). Два плеча дали бы сравнение лучшей политики
# с собой самой; третье отвечает на вопрос, ради которого фаза и ставится:
# нужен ли энергоосознанный планировщик или достаточно любой упаковки
# в паре с выключением.
#   A-peaks          лучшая политика размещения БЕЗ гашения — верхняя
#                    граница того, что даёт одно лишь размещение;
#   A-peaks-gash     она же + гашение освобождённого узла;
#   A-packing-gash   штатный упаковщик + то же гашение.
# Плечи с суффиксом -gash ходят тем же планировщиком (карта в
# harness/submit/k8s_submit.py), отличие только в работающем контроллере
# scripts/power-save.py — поэтому суффикс и нужен: иначе два плеча писали
# бы одно и то же значение config и стали неразличимы в results.
#
# ПОЧЕМУ ДВА ПРОХОДА, А НЕ ОДИН. Гашение — не вариант планировщика, а
# внешний контроллер с состоянием (какие узлы сейчас выключены), и внутри
# одного прогона харнесса его не включить на два плеча из трёх. Поэтому
# раннер делает два прохода под ОДНОЙ меткой серии: первый без
# контроллера (A-peaks), второй с контроллером (оба -gash плеча,
# чередуются внутри повторения как обычно).
# Цена решения названа прямо: вклад ГАШЕНИЯ (проход 2 против прохода 1) —
# сравнение блоками, между которыми возможен дрейф; вклад РАЗМЕЩЕНИЯ при
# гашении (peaks-gash против packing-gash) — честно парный.
#
# ПОДАЧА РАЗРЕЖЕННАЯ, и это не украшение. Гасить можно только то, что
# простаивает: в P2 на feed-mid все три узла держали ~85 % и свободных не
# было вовсе. Интервал 300 с при шести жертвах даёт занятость около трети
# ёмкости и паузы, которые длиннее порога простоя.
#
# СКОЛЬКО ЭТО ИДЁТ. Три жертвы при интервале 300 с — поток около 15 мин,
# плюс хвост последней задачи: ~19 мин на плечо. Проход 1 это 8 плеч
# (2,5 ч), проход 2 — 16 плеч (5,1 ч), вместе около восьми часов, то есть
# одна ночь. Оценка проверена сухим прогоном: при шести жертвах и том же
# интервале хвосты пуассоновского потока доходили до 54 мин на плечо, и
# фаза не влезала в ночь вовсе.
#
# ПОРОГ ГАШЕНИЯ. suspend_time задаётся раннером, а не здесь, потому что
# приходит из измерения: T = E_цикла/(P_простоя − P_выкл). По одиночному
# прогону 20.08 T ≈ 4 мин, и порог ниже ~2·T невыгоден — подъём (179 с)
# съедает выигрыш. Основное измерение идёт при 480 с; свип порога
# (Э3.2) — отдельные проходы с SUSPEND_TIME=240/480/900.
#
# ПОСЛЕ ПРОГОНА:
#   make ch-load-all STAND=prod RUN_LABEL=p3-energy \
#       RESULTS_FILE=harness/results/results-prod-p3-energy-nogash.parquet
#   make ch-load-all STAND=prod RUN_LABEL=p3-energy \
#       RESULTS_FILE=harness/results/results-prod-p3-energy-gash.parquet
#   ./scripts/energy-windows-per-arm.py --stand prod --run-label p3-energy \
#       --prom http://localhost:19090 --ch-port 8124
#   analysis/.venv/bin/python analysis/energy_metrics.py --run-label p3-energy \
#       --stand prod --baseline A-peaks --ch-port 8124
#   analysis/.venv/bin/python analysis/energy_metrics.py --run-label p3-energy \
#       --stand prod --cycle          # цена цикла и порог T из окон перехода

extends: config-prod-base.yaml

profiles:
  - ml-inference
  - high-s-io
  - high-s-net

# ПЕРВЫЙ ПРОХОД: одно плечо, контроллер гашения не запущен. Второй проход
# описан отдельным файлом config-prod-p3-energy-gash.yaml, который этот
# наследует и переопределяет два ключа. Двумя файлами, а не одним флагом,
# потому что харнесс не умеет ограничивать набор плеч из командной строки
# И переписывает results-файл с нуля при каждом прогоне: два прохода в
# один файл затёрли бы первый. Разные файлы результатов сливаются в одну
# метку серии уже в ClickHouse.
scheduler_variants:
  - peaks

repetitions: 8

pressure_scenarios:
  - name: sparse
    # По одной жертве каждого профиля, а не по две. Считано, а не на глаз:
    # шесть жертв по 28 ядер занимают 168 из 192 и не оставляют пустых
    # узлов — гасить было бы нечего, ровно как в P2 на feed-mid. Три
    # жертвы дают около 44 % ёмкости и длинные пустые промежутки, в
    # которых узел успевает простоять дольше порога.
    victims:
      - { profile: ml-inference, count: 1 }
      - { profile: high-s-io, count: 1 }
      - { profile: high-s-net, count: 1 }
    victim_arrival:
      mode: poisson
      interval_seconds: 300     # промежутки заведомо длиннее порога 480 с
    aggressors_per_node: [0]    # штормов нет: меряется энергия, не интерференция
    storms: []
    stabilize_seconds: 60
    repetitions: 8

output:
  results_dir: "results"
  results_file: "results-prod-p3-energy-nogash.parquet"
  baselines_file: "baselines-prod-p3-energy.parquet"
