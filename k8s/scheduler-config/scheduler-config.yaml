# По образцу manifests/podstate/scheduler-config.yaml из самого репозитория
# (плагины без Args просто перечисляются в plugins.score.enabled, без
# pluginConfig-блока).
#
# Два профиля в ОДНОМ процессе планировщика (один Deployment, один бинарь
# форка, в который вкомпилированы оба плагина — cmd/scheduler/main.go):
#   schedulerName: sensitivityscore — наш interference-aware плагин (H1);
#   schedulerName: trimaran         — второй бейзлайн, load-aware, но НЕ
#                                     interference-aware (H1-trimaran, см. ниже).
# default-scheduler продолжает работать штатно; плечо выбирается через
# schedulerName в манифесте Job (SCHEDULER_NAME_BY_CONFIG в k8s_submit.py).
#
# weight: 5 — НЕ дефолтная единица. plugins.score.enabled ДОБАВЛЯЕТ плагин к
# дефолтным score-плагинам (NodeResourcesFit, NodeResourcesBalancedAllocation,
# ImageLocality, ...), каждый из которых голосует со своим весом; с weight=1
# сигнал SensitivityScore регулярно перекрывается их суммой, и оба
# планировщика принимают почти одинаковые решения — H1 нечем показать.
# 5 делает interference-сигнал решающим при прочих равных, не отключая
# дефолтную балансировку по ресурсам. Это же — ручка абляции (Глава 3):
# weight=0 эквивалентен default-scheduler.
apiVersion: kubescheduler.config.k8s.io/v1
kind: KubeSchedulerConfiguration
leaderElection:
  leaderElect: false
profiles:
  - schedulerName: sensitivityscore
    plugins:
      score:
        enabled:
          - name: SensitivityScore
            weight: 5

  # Trimaran / LoadVariationRiskBalancing — контрольный бейзлайн для H1.
  # Тезис: если SensitivityScore выигрывает у default, скептик возразит, что
  # выигрыш даёт «любой учёт загрузки нод», а не именно S-вектор. Trimaran —
  # признанный load-aware плагин (из этого же форка scheduler-plugins): он
  # балансирует РИСК по фактической утилизации CPU/памяти (среднее + σ через
  # metrics-server), но СЛЕП к LLC/NUMA/IO-контенции — ровно к тому, что
  # меряет наш агент. Если наш плагин обыгрывает и Trimaran на pressure-
  # сценариях (агрессор с малым cpu-request невидим и для утилизации, и для
  # requests), значит решает именно interference-awareness, а не load-
  # awareness. Тот же вес 5, что у SensitivityScore, — единственное различие
  # плеч A-trimaran/A-sensitivityscore это сам плагин, не его вес.
  #
  # Зависимость: LoadVariationRiskBalancing читает метрики через metrics-server
  # (metricProvider.type: KubernetesMetricsServer — дефолт). Без него плагин НЕ
  # падает и не роняет процесс (профиль sensitivityscore остаётся рабочим) —
  # collector лишь логирует "Unable to populate metrics" и возвращает
  # минимальный score всем нодам. Установить metrics-server на стенде:
  # `make trimaran-deps` (см. Makefile). На dev-kind это плечо всё равно не
  # различает ноды (общий kernel), оно для партнёрского стенда.
  - schedulerName: trimaran
    plugins:
      score:
        enabled:
          - name: LoadVariationRiskBalancing
            weight: 5
    pluginConfig:
      - name: LoadVariationRiskBalancing
        args:
          safeVarianceMargin: 1
          safeVarianceSensitivity: 1
          metricProvider:
            type: KubernetesMetricsServer

  # ─── Энерговетка (партнёрская, без SS): плечи A-peaks и A-packing ───────
  #
  # Оба профиля берут утилизацию из СЕРВИСА load-watcher
  # (k8s/scheduler-config/load-watcher.yaml, образ наш — loadwatcher/
  # Dockerfile): у Peaks выбора нет (его PeaksArgs не имеет metricProvider,
  # пустой watcherAddress валит checkSpecs при старте), а packing посажен на
  # тот же сервис сознательно — единый источник утилизации делает плечи
  # сопоставимыми. Вес 5 — тот же, что у остальных плеч: различие плеч
  # только в плагине.
  #
  # Peaks: жадный выбор узла по МИНИМАЛЬНОМУ скачку мощности
  # ΔP = K1·(e^(K2·p) − e^(K2·x)), модель мощности P(x) = K0 + K1·e^(K2·x)
  # по узлам приходит из NodePowerModel. Апстрим решили НЕ патчить (17.08),
  # поэтому два обхода вместо правок кода:
  #
  # 1) КЛЮЧИ С ЗАГЛАВНОЙ. В v1-типах апстрима json-теги обоих полей PeaksArgs
  #    сломаны (`json:watcherAddress",inline"` — тег невалиден и парсером
  #    игнорируется), сериализатор берёт имена Go-полей: WatcherAddress,
  #    NodePowerModel. Строчные ключи строгий декодер отвергнет.
  # 2) КАРТА ОБЯЗАНА ПОКРЫВАТЬ ВСЕ ИЗМЕРИТЕЛЬНЫЕ УЗЛЫ, и пустой быть не
  #    может. Пустая карта → плагин читает файл из env NODE_POWER_MODEL →
  #    его нет → ошибка New() → падает ВЕСЬ процесс планировщика, включая
  #    профиль sensitivityscore. Узел без записи получает модель {0,0,0} —
  #    нулевой «скачок», а инверсия в NormalizeScore делает такой узел
  #    ЛУЧШИМ (тот же эффект у узла без метрик и у прогноза >100 % —
  #    известные грабли апстрима). Пока карта — заглушки-нули (Peaks
  #    нейтрален: все узлы равны, решают остальные score-плагины); боевые
  #    K0/K1/K2 заполняет калибровка фазы P1
  #    (docs/Энергоэффективность — статья (план).md).
  - schedulerName: peaks
    plugins:
      score:
        enabled:
          - name: Peaks
            weight: 5
    pluginConfig:
      - name: Peaks
        args:
          WatcherAddress: http://load-watcher.sensitivityscore-system.svc.cluster.local:2020
          NodePowerModel:
            # ключ — имя узла (kubectl get nodes); нули = нейтральная
            # заглушка до калибровки P1. НЕ удалять последнюю запись —
            # пустая карта роняет планировщик (см. комментарий выше).
            # смоук на лабе .72 (однонодовый k0s local72); боевую карту
            # прод-узлов заполнит калибровка P1
            andrey-hp-laptop-14-cm0xxx: {k0: 0, k1: 0, k2: 0}

  # TargetLoadPacking: упаковка до целевой утилизации CPU — базовое плечо
  # «классической» энергоэффективности (консолидация). targetUtilization 40 —
  # апстрим-дефолт; окончательное значение — ручка предрегистрации P2
  # (на трёх узлах прода стоит обсудить 50–70). У TLP json-теги исправны,
  # ключи строчные.
  - schedulerName: packing
    plugins:
      score:
        enabled:
          - name: TargetLoadPacking
            weight: 5
    pluginConfig:
      - name: TargetLoadPacking
        args:
          watcherAddress: http://load-watcher.sensitivityscore-system.svc.cluster.local:2020
          targetUtilization: 40
