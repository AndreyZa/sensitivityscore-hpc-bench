apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Лаба .72 (однонодовый k0s local72): домашний ПК-агрегатор, CH перенесён из
# systemd-юнита в кластер 17.08.2026 (restore из ch-backup, не перенос
# датадира — юнит был 26.7, образ база пинит 25.3, даунгрейд датадира CH не
# поддерживается; логическое восстановление версий не боится).
resources:
  - ../../base
  - pv.yaml

# Лаба живёт на 26.7 (версия, на которой были данные юнита; 18.08 по просьбе
# пользователя). База остаётся на 25.3 (обкатано на STAGE/прод) — апгрейд
# датадира 25.3→26.7 поддерживается, откат назад НЕТ: если понадобится
# вернуть 25.3 — только restore из ch-backup.
images:
  - name: clickhouse/clickhouse-server
    newTag: 26.7.3.19

patches:
  # localhost:8123 на узле — ТОЛЬКО loopback (hostIP), как слушал юнит:
  # ssh-туннель `make ch-tunnel` продолжает работать без изменений, в LAN
  # passwordless CH не торчит.
  - path: hostport-patch.yaml
    target:
      kind: StatefulSet
      name: clickhouse
