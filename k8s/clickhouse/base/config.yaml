# Собственный prometheus-эндпоинт ClickHouse. Причина отдельным файлом, а не
# строкой в users.yaml: это конфиг СЕРВЕРА (config.d), а не доступа (users.d).
#
# Зачем вообще: CH — точка правды всех чисел работы, но до 19.08.2026 он был
# вне мониторинга совсем. Занятость его PVC через kubelet НЕ ВИДНА — тома
# local-path отдаются как hostPath, а этот плагин метрик тома не сообщает
# (проверено на проде: семейства kubelet_volume_stats_* отсутствуют целиком).
# Значит, единственный честный источник «сколько занято и растёт ли» — сам CH.
# Он же попутно отдаёт вставки, слияния, число кусков и ошибки — то, по чему
# видно, что загрузка результатов кампании встала, ДО того как это обнаружится
# при разборе цифр.
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-config
  labels:
    app: clickhouse
data:
  prometheus.xml: |
    <!-- С 20.08.2026 секция в форме handlers: тот же порт 9363 несёт
         /metrics (самомониторинг CH, как раньше — скрейпы не трогать) и
         принимает remote_write в default.prom_ts (миграция 006, движок
         TimeSeries) — сырые ряды Prometheus живут в той же базе, что
         energy_windows и результаты серий, и любое число статьи
         пересчитывается из сырья. Обкатано на лабе (прототип ts-proto,
         k8s/monitoring/energy/README.md): рестарт CH без потерь — WAL
         Prometheus дослал буфер; ~6 Б/сэмпл. -->
    <clickhouse>
      <prometheus>
        <port>9363</port>
        <handlers>
          <expose>
            <url>/metrics</url>
            <handler>
              <type>expose_metrics</type>
              <!-- metrics — мгновенные (соединения, слияния в полёте);
                   events — накопительные счётчики (вставленные строки);
                   asynchronous_metrics — фоновые замеры раз в минуту,
                   среди них размеры таблиц и свободное место на диске;
                   errors — счётчики по кодам ошибок. -->
              <metrics>true</metrics>
              <events>true</events>
              <asynchronous_metrics>true</asynchronous_metrics>
              <errors>true</errors>
            </handler>
          </expose>
          <rw>
            <url>/write</url>
            <handler>
              <type>remote_write</type>
              <database>default</database>
              <table>prom_ts</table>
            </handler>
          </rw>
          <rr>
            <url>/read</url>
            <handler>
              <type>remote_read</type>
              <database>default</database>
              <table>prom_ts</table>
            </handler>
          </rr>
        </handlers>
      </prometheus>
    </clickhouse>
