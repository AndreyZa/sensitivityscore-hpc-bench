# Одноразовый Job: дождаться готовности ClickHouse и применить schema.sql
# (таблицы results + baselines). ConfigMap clickhouse-schema создаётся из
# ЕДИНОГО источника db/clickhouse/schema.sql (см. Makefile ch-incluster-deploy),
# чтобы схема не расходилась с загрузчиком. Функционально Job'у всё равно, где
# стоять (он лишь коннектится к сервису clickhouse), но на стенде под серией
# посторонний под на bench-узле валит preflight — прод-оверлей пинит и его.
apiVersion: batch/v1
kind: Job
metadata:
  name: clickhouse-schema
  labels:
    app: clickhouse
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: clickhouse-schema # НЕ app: clickhouse — иначе под попадёт в эндпоинты сервиса clickhouse
    spec:
      restartPolicy: OnFailure
      containers:
        - name: apply-schema
          image: clickhouse/clickhouse-server:26.7.3.19
          command: ["/bin/bash", "-c"]
          args:
            # set -e обязателен: без него неудачный apply не прерывал скрипт —
            # печаталось "schema applied", а Job падал лишь потому, что
            # следующий SHOW TABLES не находил БД. При обновлении схемы поверх
            # существующих таблиц это была бы тихая ложь: CREATE TABLE
            # IF NOT EXISTS делает повтор no-op, старые таблицы на месте,
            # SHOW TABLES проходит — Job рапортует успех, а новых колонок нет.
            - |
              set -eu
              until clickhouse-client --host clickhouse -q "SELECT 1" >/dev/null 2>&1; do
                echo "ждём сервис clickhouse..."; sleep 3;
              done
              clickhouse-client --host clickhouse --multiquery < /schema/schema.sql
              # Миграции — вторым шагом и в лексикографическом порядке (001,
              # 002, 003...). Без них свежий стенд получал схему БЕЗ таблиц и
              # колонок, добавленных после первой версии schema.sql: например
              # energy_windows (003) не появлялась нигде, кроме стендов, где
              # миграции накатывали руками через `make ch-migrate`. Все
              # миграции идемпотентны (IF NOT EXISTS), повтор безвреден.
              for m in /schema/migrations/*.sql; do
                [ -e "$m" ] || continue
                echo "миграция: $(basename "$m")"
                clickhouse-client --host clickhouse --multiquery < "$m"
              done
              echo "схема применена:"; clickhouse-client --host clickhouse -q "SHOW TABLES FROM sensitivityscore"
          volumeMounts:
            - name: schema
              mountPath: /schema
            - name: migrations
              mountPath: /schema/migrations
      volumes:
        - name: schema
          configMap:
            name: clickhouse-schema
        # Отдельный ConfigMap, а не ключи в clickhouse-schema: ключи одного
        # ConfigMap плоские, и миграции подмешались бы к schema.sql в одном
        # каталоге — glob по /schema/*.sql зацепил бы схему второй раз.
        - name: migrations
          configMap:
            name: clickhouse-migrations
