# Кто может стучаться в ClickHouse.
#
# Зачем: база с результатами исследования лежит в той же сети подов, что и
# ИЗМЕРЯЕМЫЕ задачи. Без политики любой под неймспейса серии — жертва Geant4,
# агрессор, харнесс — может писать и удалять в ней что угодно: пользователь
# default открыт на всю кластерную сеть без пароля (base/users.yaml). Это не
# гипотетическая аккуратность: агрессоры запускают произвольные команды
# stress-ng, а результаты серий — единственная точка правды исследования.
#
# Правило одно и сформулировано «от обратного»: пускаем все неймспейсы, КРОМЕ
# неймспейса серии. Так безопасность не ломается при появлении новых
# служебных компонентов (мониторинг, будущая дуальная заливка), но задачи и
# агрессоры остаются отрезанными.
#
# Проверено на живом k0s + kube-router 18.08.2026 (изолированный стенд из двух
# неймспейсов, потом снесён):
#   - под из запрещённого неймспейса: соединение не устанавливается;
#   - под из разрешённого: проходит;
#   - `kubectl port-forward` (то есть `make ch-forward`, `make ch-load`,
#     analyze с рабочей машины) РАБОТАЕТ: трафик идёт от kubelet узла, а не
#     из пода, и под podSelector политики не попадает.
# Если на другом CNI port-forward всё же отобьётся — добавить сюда ipBlock с
# подсетью узлов; поведение проверяется первым же `make ch-forward` (шаг есть
# в прод-runbook).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clickhouse-allow
  labels:
    app: clickhouse
spec:
  podSelector:
    matchLabels:
      app: clickhouse
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              # Имя неймспейса серии = HARNESS_NAMESPACE в Makefile. Если оно
              # изменится — поправить и здесь, иначе политика тихо перестанет
              # что-либо ограничивать.
              - key: kubernetes.io/metadata.name
                operator: NotIn
                values:
                  - sensitivityscore-bench
      ports:
        - protocol: TCP
          port: 8123
        - protocol: TCP
          port: 9000
        # Собственный prometheus-эндпоинт CH (base/config.yaml). Открыт тем же
        # правилом «все, кроме неймспейса серии»: Prometheus живёт в
        # sensitivityscore-monitoring и попадает в разрешённые, а жертвы и
        # агрессоры остаются отрезанными и от метрик тоже.
        - protocol: TCP
          port: 9363
