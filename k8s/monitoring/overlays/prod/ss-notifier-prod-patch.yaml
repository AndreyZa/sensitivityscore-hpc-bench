# Обход блокировки Telegram в партнёрской сети.
#
# Что происходит (замерено 19.08.2026 с ВМ 10.40.10.0 и 10.40.10.1):
#   - api.telegram.org резолвится в ЕДИНСТВЕННЫЙ адрес 149.154.166.110;
#   - TCP на 149.154.166.110:443 из партнёрской сети — таймаут (и на :80 тоже);
#   - при этом 149.154.167.220:443 (другой фронт того же Bot API) отвечает, и
#     запрос https://api.telegram.org/bot<...>/getMe через него отдаёт
#     штатный JSON `{"ok":false,"error_code":401}` с ВАЛИДНЫМ сертификатом
#     (ssl_verify_result: 0);
#   - интернет в целом открыт: github.com 200, registry-1.docker.io 401,
#     ntfy.sh 200. То есть режется не выход наружу, а конкретный адрес.
#
# Поэтому подменяем не адрес API (тогда SNI поехал бы IP-адресом и проверка
# сертификата отвалилась бы), а РАЗРЕШЕНИЕ ИМЕНИ: hostAliases пишет /etc/hosts
# пода, имя и сертификат остаются настоящими.
#
# ЭТО ХРУПКО, и знать об этом надо заранее: Telegram меняет адреса фронтов, а
# запасного рабочего адреса на 19.08.2026 не нашлось (проверены 149.154.167.50,
# 149.154.171.5, 91.108.56.130, 149.154.175.50/100 — все таймаут). Признак
# поломки: ss-notifier начнёт отдавать 502, Alertmanager — считать
# alertmanager_notifications_failed_total, и сработает SSAlertDeliveryFailing
# (виден на панели «Активные алерты» в Grafana — в канал он, по понятной
# причине, не доедет). Лечение по возрастанию усилий:
#   1) найти живой адрес фронта и поправить IP ниже;
#   2) переключить канал на ntfy, он из этой сети доступен: в Secret
#      ss-notifier-config положить SS_NOTIFY_BACKEND=ntfy + NTFY_TOPIC
#      (отправители об этом не узнают — канал выбирает служба);
#   3) попросить партнёра открыть 149.154.166.110:443.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ss-notifier
spec:
  template:
    spec:
      hostAliases:
        - ip: "149.154.167.220"
          hostnames:
            - api.telegram.org
