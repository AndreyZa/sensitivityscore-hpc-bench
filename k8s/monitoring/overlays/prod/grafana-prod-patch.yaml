# Прод: Grafana смотрит в сеть стенда, чтобы коллеги открывали дашборды сами,
# без ssh-туннелей и без доступа к kubectl.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  template:
    spec:
      containers:
        - name: grafana
          # hostPort, а НЕ NodePort: NodePort открыл бы слушающий сокет на
          # КАЖДОМ узле кластера, включая измерительные, а методика стенда
          # запрещает лишние процессы и сокеты на bench (docs «Ввод §2»).
          # hostPort поднимает порт ровно там, где живёт под, а под прибит к
          # ss-system placement-патчем — то есть слушает одна служебная ВМ.
          ports:
            - name: http
              containerPort: 3000
              hostPort: 3000
          env:
            # Анонимный ВХОД С ПРАВАМИ ПРОСМОТРА. Осознанно: коллегам нужен
            # взгляд на графики, а не учётки; раздача паролей по переписке
            # хуже и с точки зрения гигиены, и по трудозатратам. Права
            # Viewer — только чтение: ни правки дашбордов, ни доступа к
            # настройкам и ключам датасорсника.
            # Граница безопасности — периметр сети стенда: наружу порт не
            # публикуется. Админ-вход (секрет grafana-admin) продолжает
            # работать как раньше и остаётся единственным способом что-то
            # менять.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
            # Скрыть кнопку «Sign in» смысла нет — админу она нужна; а вот
            # запрет анонимной правки дашбордов важен, иначе Viewer сможет
            # менять их в рамках сессии и путать коллег.
            - name: GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION
              value: "false"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
