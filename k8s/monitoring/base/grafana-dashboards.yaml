                  },
                  {
                    "color": "red",
                    "value": 57000000000.0
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "prometheus_tsdb_storage_blocks_bytes"
            }
          ],
          "description": "Прод хранит год при потолке 60 ГБ. На потолке retention.size начнёт удалять САМЫЕ СТАРЫЕ блоки — то есть историю первых серий кампании, а не свежие данные."
        },
        {
          "type": "stat",
          "title": "Отставание последнего скрейпа",
          "id": 17,
          "datasource": {
            "type": "prometheus",
            "uid": "sensitivityscore-prom"
          },
          "gridPos": {
            "h": 6,
            "w": 4,
            "x": 10,
            "y": 38
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 120
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(time() - timestamp(up))"
            }
          ],
          "description": "Худшая цель по свежести. Растёт, если Prometheus не успевает опрашивать всё за интервал."
        },
        {
          "type": "timeseries",
          "title": "Длительность скрейпа, максимум по job",
          "id": 18,
          "datasource": {
            "type": "prometheus",
            "uid": "sensitivityscore-prom"
          },
          "gridPos": {
            "h": 6,
            "w": 10,
            "x": 14,
            "y": 38
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 6,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max by (job) (scrape_duration_seconds)",
              "legendFormat": "{{job}}"
            }
          ],
          "description": "Приближение к scrape_interval (30s, у агента 10s) означает, что цель скоро начнёт таймаутиться и в данных появятся дырки. cAdvisor на 128-поточных узлах — первый кандидат."
        },
        {
          "type": "timeseries",
          "title": "Уведомлений в час: отправлено и не удалось",
          "id": 19,
          "datasource": {
            "type": "prometheus",
            "uid": "sensitivityscore-prom"
          },
          "gridPos": {
            "h": 6,
            "w": 12,
            "x": 0,
            "y": 44
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 6,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (integration) (rate(alertmanager_notifications_total[30m])) * 3600",
              "legendFormat": "отправлено ({{integration}})"
            },
            {
              "refId": "B",
              "expr": "sum by (integration) (rate(alertmanager_notifications_failed_total[30m])) * 3600",
              "legendFormat": "НЕ УДАЛОСЬ ({{integration}})"
            }
          ],
          "description": "Весь путь Alertmanager → ss-notifier → Telegram. Неудачей считается и недоступный ss-notifier, и его 502 «канал не принял» — то есть эта панель ловит и блокировку api.telegram.org в партнёрской сети. Ровная линия отправленных без неудач при пустой таблице алертов выше — это сторож SSWatchdog, два сообщения в сутки."
        },
        {
          "type": "stat",
          "title": "Сторож активен",
          "id": 20,
          "datasource": {
            "type": "prometheus",
            "uid": "sensitivityscore-prom"
          },
          "gridPos": {
            "h": 6,
            "w": 4,
            "x": 12,
            "y": 44
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(ALERTS{alertname=\"SSWatchdog\"}) or vector(0)"
            }
          ],
          "description": "SSWatchdog обязан быть firing ВСЕГДА: он единственное правило с expr vector(1), и его смысл — отличить «тихо, потому что всё хорошо» от «тихо, потому что канал сломан». Ноль здесь означает, что признака жизни в чат больше не приходит."
        },
        {
          "type": "stat",
          "title": "Не доставлено за сутки",
          "id": 21,
          "datasource": {
            "type": "prometheus",
            "uid": "sensitivityscore-prom"
          },
          "gridPos": {
            "h": 6,
            "w": 4,
            "x": 16,
            "y": 44
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(alertmanager_notifications_failed_total[24h])) or vector(0)"
            }
