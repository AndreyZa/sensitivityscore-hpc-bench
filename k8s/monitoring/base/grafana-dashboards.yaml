          },
          "gridPos": {
            "h": 6,
            "w": 5,
            "x": 5,
            "y": 38
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
