        "sensitivityscore",
        "control-plane"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
        {
          "type": "row",
          "title": "Состояние control-plane",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "collapsed": false,
          "panels": []
        },
        {
          "type": "stat",
          "title": "Контроллеров на связи",
          "description": "node_exporter на ВМ control-plane. Ожидается 3: ВМ не являются узлами Kubernetes (контроллеры k0s работают без kubelet), поэтому их состояние видно ТОЛЬКО отсюда — в kubectl get nodes их нет.",
          "datasource": {
            "type": "prometheus",
