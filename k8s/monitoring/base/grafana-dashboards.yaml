              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (label_sensitivityscore_phd_profile) (kube_job_status_active{namespace=\"sensitivityscore-bench\"} * on (job_name, namespace) group_left(label_sensitivityscore_phd_profile) kube_job_labels{namespace=\"sensitivityscore-bench\"})",
              "legendFormat": "{{label_sensitivityscore_phd_profile}}"
            }
          ],
          "description": "Метки Job'ов экспортируются kube-state-metrics только по явному allowlist (--metric-labels-allowlist); до 19.08.2026 kube_job_labels был пуст, и такого разреза не существовало."
        },
        {
          "type": "timeseries",
          "title": "Поды серии по узлам",
          "id": 11,
          "datasource": {
            "type": "prometheus",
            "uid": "sensitivityscore-prom"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 6
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 6,
                "showPoints": "never",
                "stacking": {
                  "mode": "normal"
                }
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count by (node) (kube_pod_info{namespace=\"sensitivityscore-bench\"})",
              "legendFormat": "{{node}}"
            }
          ],
          "description": "Куда планировщик реально раскладывает жертвы. Перекос на один узел при простаивающих остальных — это либо задумка плеча (packing/peaks консолидируют), либо признак того, что оси чувствительности молчат и все узлы получают одинаковый score."
        },
        {
          "type": "table",
          "title": "Точек плана завершено: конфигурация × плечо",
