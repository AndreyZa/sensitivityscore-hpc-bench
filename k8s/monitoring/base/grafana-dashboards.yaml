          "description": "Второй способ получить удлинение задачи, не имеющее отношения к интерференции (первый — квота cgroup, панель выше). Жертва досчитывает честно, харнесс пишет её runtime, и замедление приписывается соседям. Отличие от CFS: причина вне кластера, и увидеть её можно только счётчиками ядра, которые снимает metrics-agent (pkg/cputhrottle, счётчики дедуплицированы по топологии — иначе пакетный умножился бы на число ядер). Любой ненулевой столбик во время серии делает её точки подозрительными.",
