        {
          "type": "text",
          "title": "Чего здесь нет и почему",
          "gridPos": {
            "h": 7,
            "w": 24,
            "x": 0,
            "y": 48
          },
          "id": 20,
          "options": {
            "mode": "markdown",
            "content": "**Серверных метрик etcd здесь нет** — ни `etcd_disk_wal_fsync_duration_seconds`, ни\n`etcd_server_has_leader`, ни смен лидера, ни размера БД. Причина: k0s поднимает etcd со\nслушателем метрик на `127.0.0.1:2381`, снаружи порт закрыт (проверено 18.08.2026 со всех трёх\nВМ). Чтобы их получить, нужно задать `spec.storage.etcd.extraArgs.listen-metrics-urls` в конфиге\nk0s и **перезапустить контроллеры** по одному — работа для окна между кампаниями, не под серией.\n\nПока их нет, замена такая: **ожидание диска** и **средняя задержка записи** выше (со стороны ВМ)\nплюс **p99 обращений к etcd** (со стороны apiserver). Этой пары хватает, чтобы поймать\nдеградацию диска под etcd — то самое узкое место, ради которого `make check` гоняет пробу fsync.\n\nТо же с `kube-scheduler` и `kube-controller-manager`: они слушают `127.0.0.1` (порты 10259 и\n10257) и в сборе не участвуют. Планировщик стенда `sensitivityscore` — другое дело, он работает\nподом и собирается как обычная цель."
          }
