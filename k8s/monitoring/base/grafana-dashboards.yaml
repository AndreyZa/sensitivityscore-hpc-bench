          ]
        },
        {
          "type": "stat",
          "title": "Старейший активный прогон",
          "id": 6,
          "datasource": {
            "type": "prometheus",
            "uid": "sensitivityscore-prom"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 16,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(time() - (kube_job_created{namespace=\"sensitivityscore-bench\"} and on (job_name, namespace) (kube_job_status_active{namespace=\"sensitivityscore-bench\"} > 0)))"
            }
          ],
          "description": "Зависший прогон виден здесь раньше, чем в логе харнесса: тот ждёт условия Complete и молчит."
        },
        {
          "type": "stat",
          "title": "ClickHouse на связи",
          "id": 7,
          "datasource": {
            "type": "prometheus",
            "uid": "sensitivityscore-prom"
