            "y": 33
          },
          "options": {
            "mode": "markdown",
            "content": "**Прогоны.** Панели серии строятся на объектах Job, а харнесс их **удаляет** после снятия результата (`cleanup` в `harness/submit/k8s_submit.py`). Поэтому это картина «что идёт сейчас», а не журнал кампании. Журнал — таблицы ClickHouse, и там же точка правды всех чисел (`analysis/canonical_numbers.py --recompute`).\n\n**Разрез по плечам** появляется из `kube_job_labels`: метки объектов kube-state-metrics экспортирует только по явному allowlist, и он ограничен двумя метками харнесса (`sensitivityscore.phd/config`, `sensitivityscore.phd/profile`) — метки Job'ов иначе разносят кардинальность TSDB на каждую точку плана.\n\n**Том ClickHouse — не 5 ГБ.** PVC запрошен на 5Gi, но выдаёт его `local-path`, то есть hostPath, и квоты там нет: CH видит весь диск ss-system, на котором рядом лежит TSDB Prometheus. Занятость тома через kubelet посмотреть нельзя вовсе — `kubelet_volume_stats_*` для hostPath не публикуются, поэтому все дисковые панели здесь идут из самого CH."
          }
        },
