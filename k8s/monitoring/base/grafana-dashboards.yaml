          "description": "Ненулевое значение = алерты стенда сейчас никуда не приходят. Правило SSAlertDeliveryFailing говорит о том же, но доехать в канал оно, по понятной причине, не может — смотреть надо здесь."
        },
        {
          "type": "stat",
          "title": "Alertmanager на связи",
          "id": 22,
          "datasource": {
            "type": "prometheus",
            "uid": "sensitivityscore-prom"
          },
          "gridPos": {
            "h": 6,
            "w": 4,
            "x": 20,
            "y": 44
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "up{job=\"alertmanager\"}"
            }
          ],
          "description": "Появился 19.08.2026. До него правила стенда вычислялись, но адресата не имели: единственным следом срабатывания была панель «Активные алерты» рядом."
        }
      ],
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 0,
      "links": [],
      "fiscalYearStartMonth": 0,
      "weekStart": "",
      "version": 1
