          "id": 40,
          "gridPos": {
            "h": 6,
            "w": 24,
            "x": 0,
            "y": 48
          },
          "options": {
            "mode": "markdown",
            "content": "**Что здесь показано.** Это НАШ планировщик — под `sensitivityscore-scheduler` в `sensitivityscore-system`, один процесс с четырьмя профилями. Встроенный планировщик k0s на контроллерах живёт на дашборде «Control plane — ВМ и API» и с этими цифрами не смешивается: у него job `kube-scheduler` и единственный профиль `default-scheduler`.\n\n**Профиль = плечо эксперимента.** Метка `profile` — это `schedulerName` из манифеста Job'а, поэтому «сравнить стоимость плеч» здесь буквально: одна панель, четыре линии.\n\n**Что можно нести в текст, а что нет.** Точка расширения `Score` меряется в каждом цикле (панели «Время в точке Score» и «Средняя стоимость Score на под») — это надёжные числа. Гистограмма по отдельным плагинам сэмплируется на 10% и не знает профиля: годится посмотреть порядок величины, но не для таблицы в статье.\n\n**На простое панели пусты.** Счётчики нарастают только когда через планировщик идут поды; между кампаниями пустота — норма, а не поломка."
          }
        },
