          "id": 31,
          "options": {
            "mode": "markdown",
            "content": "Дашборд собирает **три источника**, и это важно понимать, глядя на цифры.\n\n1. **С самих ВМ** (node_exporter, ставится ролью `nodeexporter` провизионера): железо и\n   состояние службы `k0scontroller`. Контроллеры k0s работают без kubelet, поэтому в\n   `kubectl get nodes` их нет и обычный мониторинг узлов до них не достаёт.\n2. **С etcd** (порт 2381): fsync WAL, лидер, размер БД. Слушатель открыт конфигом k0s\n   (`storage.etcd.extraArgs.listen-metrics-urls`) — по умолчанию k0s держит его на localhost,\n   и до 19.08.2026 этих метрик не было вовсе.\n3. **С apiserver, планировщика и controller-manager**: очереди, задержки, коды ответов.\n\nЕсли панели etcd, планировщика или controller-manager пусты — на этом стенде ещё не применён\nконфиг k0s, открывающий их слушатели: цели будут DOWN в Prometheus. Применяется вместе с\nперезапуском контроллеров, то есть в окно между кампаниями.\n\nПланировщик стенда `sensitivityscore` здесь НЕ показан — он работает подом и живёт на\nотдельном дашборде «Планировщик — плечи и стоимость» (uid ss-scheduler), где разложен по\nчетырём профилям-плечам."
