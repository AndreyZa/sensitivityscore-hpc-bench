              "expr": "sum by (label_sensitivityscore_phd_config, label_sensitivityscore_phd_profile) (kube_job_status_succeeded{namespace=\"sensitivityscore-bench\"} * on (job_name, namespace) group_left(label_sensitivityscore_phd_config, label_sensitivityscore_phd_profile) kube_job_labels{namespace=\"sensitivityscore-bench\"})"
