          ],
          "description": "Что сработало прямо сейчас. С 19.08.2026 алерты ещё и УХОДЯТ в Telegram через Alertmanager и ss-notifier (панели доставки ниже), но эта таблица остаётся единственным местом, где видно правило, о котором канал сообщить НЕ МОЖЕТ — в первую очередь SSAlertDeliveryFailing, то есть поломку самого канала. Пустая таблица = ни одно правило не активно. Смысл правил стенда — не дежурство, а защита от молчаливо неверных серий: почти каждое описывает состояние, при котором цифры продолжают писаться, но нести их в диссертацию уже нельзя."
