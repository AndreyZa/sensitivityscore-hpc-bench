  energy.json: |
    {
      "uid": "ss-energy",
      "title": "Энергия — мощность узлов",
      "tags": ["sensitivityscore", "energy"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": {"from": "now-1h", "to": "now"},
      "templating": {
        "list": [
          {
            "name": "node",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "sensitivityscore-prom"},
            "query": "label_values(idrac_power_watts, node)",
            "multi": false,
            "includeAll": false,
            "refresh": 2
          }
        ]
      },
      "panels": [
        {
          "type": "row", "title": "Мощность по узлам", "id": 1, "collapsed": false, "panels": [],
