                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 4
                  }
                ]
              }
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none"
          },
          "id": 3
        },
        {
          "type": "stat",
