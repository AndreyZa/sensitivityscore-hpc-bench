          "description": "Ненулевая линия у ЖЕРТВЫ (geant4-*, bench-*) означает, что задача досчитывала дольше из-за квоты cgroup, а не из-за интерференции — и харнесс запишет это удлинение как замедление. Причина в логах не видна и в цифрах неотличима от измеряемого эффекта, поэтому точки плана, снятые при троттлинге, негодны (правило SSVictimThrottled, порог 1%). У агрессоров троттлинг НОРМАЛЕН: их зажимают лимитами по замыслу, это и есть интерференция. Метрики добавлены в keep-список cAdvisor 19.08.2026 — до этого они отбрасывались на скрейпе.",
