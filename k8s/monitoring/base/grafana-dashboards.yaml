            "x": 12,
            "y": 52
          },
          "description": "Источник на прод-стенде — /proc/cpuinfo, а не cpufreq: у R760 каталога cpufreq нет вовсе, P-states держит BIOS. Но частота при этом честная — ядро считает ЭФФЕКТИВНУЮ по счётчикам APERF/MPERF. Какой источник сработал, говорит ss_agent_cpu_freq_source; смешивать их нельзя (cpufreq отдаёт запрошенное у драйвера, cpuinfo — фактически достигнутое).\n\nВАЖНО для методики: «BIOS управляет частотой» НЕ означает «частота прибита к максимуму». На простое 19.08.2026 наблюдалось 785–797 МГц при номинале 2800 — ядра реально спускаются вниз. Смотреть надо МАКСИМУМ вместе с минимумом: жертве отдают 28 CPU из 64, остальные простаивают, поэтому минимум всегда покажет простаивающее ядро, а среднее будет им размыто. Максимум — то, до чего разгонялись занятые ядра. Опрос раз в минуту: чтение стоит IPI или MSR на ядро, и трогать измеряемые ядра чаще ради этого числа незачем.",
