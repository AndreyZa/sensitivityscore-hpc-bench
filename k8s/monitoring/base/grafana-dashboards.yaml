  # Дашборд 5 — сам планировщик стенда. Появился 19.08.2026, и до него метрик
  # нашего бинаря не снимал никто: job kube-scheduler в prometheus-configmap
  # смотрит на ВСТРОЕННЫЙ планировщик k0s на контроллерах, поэтому в проде
  # scheduler_schedule_attempts_total существовал ровно с одним значением
  # profile="default-scheduler". Стоимость плеча — половина утверждения работы,
  # и она была ненаблюдаема.
  scheduler.json: |
    {
      "uid": "ss-scheduler",
      "title": "Планировщик — плечи и стоимость",
      "tags": [
        "sensitivityscore",
        "scheduler"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
        {
          "type": "row",
          "title": "Состояние",
          "id": 1,
          "collapsed": false,
          "panels": [],
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          }
        },
        {
          "type": "stat",
          "title": "Планировщик на связи",
          "id": 2,
          "datasource": {
            "type": "prometheus",
            "uid": "sensitivityscore-prom"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "up{job=\"sensitivityscore-scheduler\"}"
            }
          ],
          "description": "Скрейп идёт по https с bearer-токеном пода Prometheus; планировщик проверяет запрос делегированием в apiserver. Ноль здесь = цель DOWN, а не обязательно «планировщик умер» — сверять с рестартами на дашборде инфраструктуры."
        },
        {
          "type": "stat",
