          "description": "Главная панель этого ряда. Плечо, различающее узлы по нагрузке, может различать их только если разброс НЕ НОЛЬ. Ноль во время кампании означает, что trimaran/peaks/packing раскладывают вслепую — и разница между ними и sensitivityscore в такой серии ничего не измеряет. На простое ноль — норма."
        },
        {
          "type": "timeseries",
          "title": "Утилизация узлов глазами load-watcher",
