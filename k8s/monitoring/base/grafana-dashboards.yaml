          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value": true,
                  "__name__": true
                }
              }
            }
          ],
          "description": "«Нет метрики» — это не «метрика плохая»: панели по замолчавшей цели просто пусты, а алерты по ней вечно неактивны, что неотличимо от «всё хорошо». Метрик etcd на этом стенде не было месяцами именно так. Пустая таблица здесь — норма."
