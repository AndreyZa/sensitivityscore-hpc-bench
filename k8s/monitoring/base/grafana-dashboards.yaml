  # Дашборд 6 — путь данных эксперимента: прогоны серии (объекты Job) и
  # хранилище, куда стекаются результаты. Оба конца этого пути были вне
  # мониторинга: kube_job_* не использовала ни одна панель, а ClickHouse не
  # скрейпился вовсе.
  campaign.json: |
    {
      "uid": "ss-campaign",
      "title": "Кампания и хранилище",
      "tags": [
        "sensitivityscore",
        "campaign"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {
        "from": "now-12h",
        "to": "now"
      },
      "panels": [
        {
          "type": "row",
          "title": "Прогоны серии",
          "id": 1,
          "collapsed": false,
          "panels": [],
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          }
        },
        {
          "type": "stat",
          "title": "Активных прогонов",
          "id": 2,
          "datasource": {
            "type": "prometheus",
            "uid": "sensitivityscore-prom"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_job_status_active{namespace=\"sensitivityscore-bench\"}) or vector(0)"
            }
          ],
          "description": "Job'ы в неймспейсе серии. Харнесс удаляет Job после снятия результата, поэтому это «прямо сейчас в полёте», а не «всего за кампанию»."
        },
        {
          "type": "stat",
          "title": "Точек завершено",
          "id": 3,
          "datasource": {
            "type": "prometheus",
            "uid": "sensitivityscore-prom"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_job_status_succeeded{namespace=\"sensitivityscore-bench\"}) or vector(0)"
            }
          ],
          "description": "Считается по живым объектам Job. Харнесс их подчищает (cleanup в k8s_submit.py), так что число падает по ходу кампании — точка правды по прогонам всё равно ClickHouse, а не эта панель."
        },
        {
          "type": "stat",
          "title": "Упало",
          "id": 4,
          "datasource": {
            "type": "prometheus",
            "uid": "sensitivityscore-prom"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_job_status_failed{namespace=\"sensitivityscore-bench\"}) or vector(0)"
            }
          ],
          "description": "backoffLimit=0, поэтому любое падение — потерянная точка плана, а не ретрай."
        },
        {
          "type": "stat",
          "title": "Подов серии на узлах",
          "id": 5,
          "datasource": {
            "type": "prometheus",
            "uid": "sensitivityscore-prom"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(kube_pod_info{namespace=\"sensitivityscore-bench\"}) or vector(0)"
