            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "prometheus_tsdb_head_series"
            }
          ],
          "description": "Резкий рост = кто-то добавил метку с высокой кардинальностью (метки Job'ов серии — типичный источник; поэтому у kube-state-metrics стоит закрытый allowlist на две метки харнесса)."
        },
        {
          "type": "stat",
          "title": "Объём TSDB на диске",
          "id": 16,
          "datasource": {
