        },
        {
          "type": "timeseries", "title": "Вся система (iDRAC)", "id": 2,
          "description": "PowerConsumedWatts из BMC: розетка минус потери PSU. Источник для сверки с PDU (Э0.1).",
          "datasource": {"type": "prometheus", "uid": "sensitivityscore-prom"},
          "gridPos": {"h": 8, "w": 10, "x": 0, "y": 1},
          "fieldConfig": {"defaults": {"unit": "watt", "custom": {"lineWidth": 2, "fillOpacity": 6}}, "overrides": []},
          "targets": [
            {"refId": "A", "expr": "idrac_power_watts", "legendFormat": "{{node}}"}
          ]
        },
        {
          "type": "timeseries", "title": "CPU+DRAM (RAPL pkg+dram)", "id": 3,
          "description": "Дифференцируемая счётчиками часть узла. Окно энергии считает energy-window.py разностью счётчика, не этим графиком.",
          "datasource": {"type": "prometheus", "uid": "sensitivityscore-prom"},
          "gridPos": {"h": 8, "w": 10, "x": 10, "y": 1},
          "fieldConfig": {"defaults": {"unit": "watt", "custom": {"lineWidth": 2, "fillOpacity": 6}}, "overrides": []},
          "targets": [
            {"refId": "A", "expr": "sum by (node) (rate(ss_node_rapl_joules_total{domain=~\"package-.*|dram\"}[2m]))", "legendFormat": "{{node}}"}
          ]
        },
        {
          "type": "stat", "title": "Кластер (iDRAC)", "id": 4,
          "datasource": {"type": "prometheus", "uid": "sensitivityscore-prom"},
          "gridPos": {"h": 8, "w": 4, "x": 20, "y": 1},
          "fieldConfig": {"defaults": {"unit": "watt", "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}}, "overrides": []},
          "targets": [{"refId": "A", "expr": "sum(idrac_power_watts)"}]
        },
        {
          "type": "row", "title": "Сверка источников и годность", "id": 5, "collapsed": false, "panels": [],
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 9}
        },
        {
          "type": "timeseries", "title": "Цепочка Э0.4 на узле $node: Σ(pkg+dram) ≤ psys ≤ iDRAC", "id": 6,
          "description": "Порядковый критерий предрегистрации: нарушение порядка линий = недоверие инструменту. PDU добавится сюда же, когда партнёры дадут доступ.",
          "datasource": {"type": "prometheus", "uid": "sensitivityscore-prom"},
          "gridPos": {"h": 8, "w": 16, "x": 0, "y": 10},
          "fieldConfig": {"defaults": {"unit": "watt", "custom": {"lineWidth": 2, "fillOpacity": 0}}, "overrides": []},
          "targets": [
            {"refId": "A", "expr": "sum(rate(ss_node_rapl_joules_total{node=\"$node\",domain=~\"package-.*|dram\"}[2m]))", "legendFormat": "RAPL pkg+dram"},
            {"refId": "B", "expr": "sum(rate(ss_node_rapl_joules_total{node=\"$node\",domain=\"psys\"}[2m]))", "legendFormat": "RAPL psys"},
            {"refId": "C", "expr": "idrac_power_watts{node=\"$node\"}", "legendFormat": "iDRAC (система)"}
          ]
        },
        {
          "type": "stat", "title": "Свежесть iDRAC-опроса", "id": 7,
          "description": "Pushgateway помнит последний push вечно — панель отличает «мощность такая» от «poller молчит».",
          "datasource": {"type": "prometheus", "uid": "sensitivityscore-prom"},
          "gridPos": {"h": 8, "w": 4, "x": 16, "y": 10},
          "fieldConfig": {"defaults": {"unit": "s", "thresholds": {"mode": "absolute", "steps": [
            {"color": "green", "value": null}, {"color": "orange", "value": 60}, {"color": "red", "value": 300}
          ]}}, "overrides": []},
          "targets": [{"refId": "A", "expr": "max(time() - idrac_poll_timestamp_seconds)"}]
        },
        {
          "type": "stat", "title": "RAPL-зон (мин. по bench)", "id": 8,
          "description": "Ожидается 5 (2 пакета + 2 dram + psys). Меньше — агент потерял powercap; No data на STAGE — норма.",
          "datasource": {"type": "prometheus", "uid": "sensitivityscore-prom"},
          "gridPos": {"h": 8, "w": 4, "x": 20, "y": 10},
          "fieldConfig": {"defaults": {"unit": "none", "thresholds": {"mode": "absolute", "steps": [
            {"color": "red", "value": null}, {"color": "green", "value": 5}
          ]}}, "overrides": []},
          "targets": [{"refId": "A", "expr": "min(ss_agent_rapl_zones{node=~\"wrk-.*\"})"}]
        },
        {
          "type": "row",
          "title": "Входы блоков питания",
          "id": 9,
          "collapsed": false,
          "panels": [],
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 18
          }
        },
        {
          "type": "timeseries",
          "title": "Мощность по входам БП",
          "id": 10,
          "datasource": {
            "type": "prometheus",
            "uid": "sensitivityscore-prom"
          },
          "gridPos": {
            "h": 7,
            "w": 16,
            "x": 0,
            "y": 19
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 6,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "idrac_psu_input_watts",
              "legendFormat": "{{node}} / {{psu}}"
            }
          ],
          "description": "Вход КАЖДОГО БП по отдельности — то, что понадобится для сверки с банками PDU, когда партнёр даст карту розеток. На 19.08.2026 картина такая: PS1 несёт нагрузку (240–270 Вт), PS2 стоит в дежурке ~5 Вт. Для карты розеток суммировать оба входа: они воткнуты в разные розетки и, возможно, в разные банки."
        },
        {
          "type": "stat",
          "title": "Сумма входов PSU по стойке",
          "id": 11,
          "datasource": {
            "type": "prometheus",
            "uid": "sensitivityscore-prom"
          },
          "gridPos": {
            "h": 7,
            "w": 4,
            "x": 16,
            "y": 19
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(idrac_psu_input_watts)"
            }
          ],
          "description": "Ближайшая к розетке величина, которую стенд знает сам. С Metered-PDU (AP8853) сверять можно только на уровне суммы узлов или банка — по-розеточного учёта у этой модели нет."
        },
        {
          "type": "stat",
          "title": "Согласие сенсоров: вход БП ↔ система",
          "id": 12,
          "datasource": {
            "type": "prometheus",
            "uid": "sensitivityscore-prom"
          },
          "gridPos": {
            "h": 7,
            "w": 4,
            "x": 20,
            "y": 19
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.1
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(sum(idrac_psu_input_watts) - sum(idrac_power_watts)) / sum(idrac_power_watts)"
            }
          ],
          "description": "Относительное расхождение двух независимых групп сенсоров ОДНОГО BMC. Это НЕ КПД блоков: PowerConsumedWatts у Dell — величина уже со стороны входа, поэтому по построению обе цифры должны совпадать. На простое 19.08.2026 наблюдалось −3% (771 Вт против 795 Вт) — это в пределах точности сенсоров BMC, а не нарушение физики. Смотреть здесь надо не знак, а СИСТЕМАТИЧЕСКИЙ уход: если под нагрузкой расхождение растёт до десятков процентов, значит одна из групп сенсоров врёт, и цепочку Э0.4 нельзя замыкать на iDRAC."
        }
      ],
      "annotations": {
        "list": [
          {
            "name": "Серии",
