apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: sensitivityscore-monitoring
data:
  prometheus.yml: |
    # Scrape-конфиг стенда. Ключевое ограничение — ЧИСТОТА ИЗМЕРЕНИЙ:
    # на bench-узлах не должно появиться ни одного нового процесса
    # (docs «Ввод прод-стенда (Этап 0)» §2 — системные компоненты не шумят в
    # LLC/IO/Net измерительных узлов). Поэтому узловые метрики bench снимаются
    # с УЖЕ РАБОТАЮЩИХ там kubelet/cAdvisor и metrics-agent, а node_exporter
    # живёт только на ss-system (см. node-exporter-daemonset.yaml).
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
      external_labels:
        # Провенанс данных, а не косметика: метка stand отличает прогоны
        # стендов друг от друга (ср. `make ch-load STAND=prod`). Значение
        # подставляется из переменной окружения STAND (см. Deployment,
        # --enable-feature=expand-external-labels), чтобы prod-overlay менял
        # одну переменную, а не копировал весь конфиг.
        stand: ${STAND}

    rule_files:
      - /etc/prometheus/rules/*.yaml

    # Куда уходят сработавшие правила. До 19.08.2026 этого блока не было:
    # правила вычислялись, но адресата не имели, и единственным следом
    # срабатывания была панель в Grafana — то есть узнать о беде можно было,
    # только придя посмотреть. Для серии, которая идёт 4 часа без человека,
    # это не наблюдаемость.
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager.sensitivityscore-monitoring.svc.cluster.local:9093"]

    scrape_configs:
      # --- сам Prometheus -----------------------------------------------
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      # --- kube-apiserver ------------------------------------------------
      - job_name: kubernetes-apiservers
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels:
              [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https

      # --- ВМ control-plane: node_exporter systemd-сервисом ---------------
      # Контроллеры k0s работают БЕЗ kubelet: они не узлы Kubernetes, `role:
      # node` их не находит, DaemonSet мониторинга до них не достаёт, и до
      # 18.08.2026 по ним не было ни одной метрики железа — при том, что
      # именно на них живёт etcd, а его узкое место (fsync диска) стенд
      # объявляет критичным. Экспортёр ставится ролью nodeexporter
      # провизионера (hpc-k0s-provision, playbooks/prep.yml).
      #
      # Адреса НЕ прописаны: берём эндпоинты сервиса kubernetes (это ровно
      # адреса контроллеров, тот же источник, что у job выше) и подменяем
      # порт на 9100. Конфиг остаётся переносимым между стендами, а список
      # контроллеров не разъезжается с реальностью при их замене.
      - job_name: control-plane-nodes
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels:
              [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https
          - source_labels: [__address__]
            action: replace
            regex: '([^:]+)(?::\d+)?'
            replacement: '${1}:9100'
            target_label: __address__
          # instance = адрес ВМ; role — чтобы дашборд отличал контроллеры от
          # узлов кластера, у которых экспортёр приходит подом.
          - target_label: role
            replacement: control-plane

      # --- etcd, планировщик и controller-manager --------------------------
      # Требуют конфига k0s, открывающего слушатели наружу
      # (hpc-k0s-provision, playbooks/templates/k0sctl.yaml.j2: storage.etcd
      # extraArgs listen-metrics-urls + bind-address у scheduler/
      # controllerManager). Без него цели будут DOWN — это не поломка сбора,
      # а признак стенда, где конфиг ещё не применён.
      #
      # Адреса, как и у job выше, берём из эндпоинтов сервиса kubernetes.
      - job_name: etcd
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels:
              [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https
          - source_labels: [__address__]
            action: replace
            regex: '([^:]+)(?::\d+)?'
            replacement: '${1}:2381'
            target_label: __address__
          - target_label: role
            replacement: control-plane

      # Планировщик и controller-manager отдают /metrics по HTTPS с
      # аутентификацией — ходим токеном ServiceAccount (RBAC на
      # nonResourceURLs /metrics уже есть в prometheus-rbac.yaml).
      # Сертификат у них самоподписанный на 127.0.0.1, поэтому проверку имени
      # отключаем — соединение внутри приватной сети стенда.
      - job_name: kube-scheduler
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels:
              [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https
          - source_labels: [__address__]
            action: replace
            regex: '([^:]+)(?::\d+)?'
            replacement: '${1}:10259'
            target_label: __address__
          - target_label: role
            replacement: control-plane

      - job_name: kube-controller-manager
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels:
              [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https
          - source_labels: [__address__]
            action: replace
            regex: '([^:]+)(?::\d+)?'
            replacement: '${1}:10257'
            target_label: __address__
          - target_label: role
            replacement: control-plane

      # --- kubelet: узловые метрики bench БЕЗ node_exporter ---------------
      # role: node уже даёт <InternalIP>:10250. Скрейпим напрямую, а не через
      # /api/v1/nodes/<n>/proxy: узлы в одной приватной сети (192.168.0.0/24),
      # это не нагружает apiserver. Если на другом стенде путь закрыт —
      # переключить на apiserver-proxy (см. README рядом).
      - job_name: kubernetes-nodes-kubelet
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true # kubelet-сертификаты self-signed на k0s
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
          # Роль узла (bench/ss-system) отдельной меткой — по ней дашборды
          # отделяют измерительные узлы от системного.
          #
          # ВАЖНО: сверяемся с __meta_kubernetes_node_labelpresent_*, а НЕ с
          # __meta_kubernetes_node_label_*. Роли — метки-флаги с ПУСТЫМ
          # значением ("node-role.kubernetes.io/bench": ""), а Prometheus не
          # отличает пустое значение от отсутствующей метки: regex "" совпал
          # бы на КАЖДОМ узле, оба правила отработали бы на всех, и ss_role у
          # всех стал бы значением последнего правила (проверено на STAGE:
          # все четыре узла получали ss-system). labelpresent даёт "true"
          # ровно там, где метка действительно есть.
          - source_labels: [__meta_kubernetes_node_labelpresent_node_role_kubernetes_io_bench]
            regex: "true"
            target_label: ss_role
            replacement: bench
          - source_labels: [__meta_kubernetes_node_labelpresent_node_role_kubernetes_io_ss_system]
            regex: "true"
            target_label: ss_role
            replacement: ss-system

      # --- cAdvisor: per-pod CPU/mem/IO, тоже из kubelet -------------------
      - job_name: kubernetes-nodes-cadvisor
        kubernetes_sd_configs:
          - role: node
        scheme: https
        metrics_path: /metrics/cadvisor
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
        metric_relabel_configs:
          # cAdvisor отдаёт очень широкий набор; на 2-ядерной ss-system-ноде
          # TSDB дешевле держать узким. Оставляем то, на чём строятся
          # дашборды: CPU/RSS/сеть/файловая система пода.
          #
          # cpu_cfs_* добавлены 19.08.2026 и добавлены не для полноты. CFS
          # троттлинг УДЛИНЯЕТ время задачи, ничего не сообщая: жертва честно
          # досчитывает, харнесс пишет её runtime, и замедление приписывается
          # интерференции, хотя причина — квота cgroup. Это ровно тот класс
          # молчаливо неверных чисел, от которого стенд защищается остальными
          # проверками (ср. ловушку 18.08: жертва не Guaranteed → static-
          # пиннинг молча не работает). Метрики cAdvisor на bench-узлах отдаёт
          # и так — новых процессов на измерительный узел не приходит.
          - source_labels: [__name__]
            action: keep
            regex: container_(cpu_usage_seconds_total|cpu_cfs_(periods_total|throttled_(periods_total|seconds_total))|memory_working_set_bytes|memory_rss|network_(receive|transmit)_bytes_total|fs_(reads|writes)_bytes_total|spec_(cpu_quota|memory_limit_bytes))
          # Пустой container= — это pod-level cgroup, дубль к сумме контейнеров.
          - source_labels: [container]
            action: drop
            regex: ""

      # --- kube-state-metrics --------------------------------------------
      # ОТДЕЛЬНАЯ job, а не общая kubernetes-pods, и это принципиально.
      # KSM экспортирует метрики ПРО другие объекты и несёт собственные метки
      # namespace/pod. Общая job проставляет namespace/pod как метки ЦЕЛИ, и
      # при honor_labels=false (по умолчанию) метка цели побеждает: настоящий
      # namespace уезжает в exported_namespace, а namespace у ВСЕХ серий
      # становится тем, где живёт сам KSM. Тогда
      # kube_pod_status_phase{namespace="sensitivityscore-bench"} всегда пуст,
      # а алерты по namespace тихо считают весь кластер одним неймспейсом.
      # honor_labels: true возвращает приоритет меткам самой метрики.
      - job_name: kube-state-metrics
        honor_labels: true
        static_configs:
          - targets: ["kube-state-metrics.sensitivityscore-monitoring.svc.cluster.local:8080"]

      # --- pushgateway: метрики, приносимые извне (poller iDRAC на лабе) ---
      # honor_labels обязателен: узел задаёт метка node из тела push'а, а не
      # instance цели скрейпа (иначе все серии слиплись бы в один pushgateway).
      - job_name: pushgateway
        honor_labels: true
        static_configs:
          - targets: ["pushgateway.sensitivityscore-monitoring.svc.cluster.local:9091"]

      # --- Alertmanager: доставка уведомлений -----------------------------
      # Нужен не для полноты, а ради одной метрики:
      # alertmanager_notifications_failed_total. Она закрывает весь путь
      # целиком — если ss-notifier не смог достучаться до Telegram, он отдаёт
      # 502, и счётчик растёт. Правило SSAlertDeliveryFailing построено на ней.
      - job_name: alertmanager
        static_configs:
          - targets: ["alertmanager.sensitivityscore-monitoring.svc.cluster.local:9093"]

      # --- планировщик стенда --------------------------------------------
      # Тот самый бинарь, ради которого стенд существует. До 19.08.2026 его
      # метрик не было: job kube-scheduler выше снимает ВСТРОЕННЫЙ планировщик
      # k0s на контроллерах, и в проде `scheduler_schedule_attempts_total`
      # существовал ровно с одним значением profile="default-scheduler" — ни
      # одного ряда по нашим четырём плечам (sensitivityscore/trimaran/peaks/
      # packing). Без этого стоимость плеча (задержка планирования, время в
      # Score) была ненаблюдаема, хотя это половина утверждения работы.
      #
      # Схема https и токен: планировщик слушает 10259 только по TLS и
      # проверяет запрос делегированием (TokenReview + SubjectAccessReview на
      # nonResourceURL /metrics). Права у SA prometheus уже есть
      # (prometheus-rbac.yaml), поэтому bearer-токен пода — единственное, что
      # нужно. Сертификат self-signed (генерируется при старте) → skip-verify.
      #
      # Отдельная job, а не аннотация prometheus.io/scrape: та отправила бы
      # цель в общую job kubernetes-pods, которая ходит по HTTP.
      - job_name: sensitivityscore-scheduler
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [sensitivityscore-system]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_component]
            action: keep
            regex: scheduler
          - source_labels: [__address__]
            action: replace
            regex: ([^:]+)(?::\d+)?
            replacement: $1:10259
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # --- ClickHouse: точка правды чисел ---------------------------------
      # Эндпоинт включается конфигом самого CH (k8s/clickhouse/base/config.yaml)
      # и слушает 9363 на поде. Сервисом порт не публикуется — ходим на под.
      #
      # Почему не через kubelet: занятость тома у CH через kubelet НЕ видна —
      # local-path отдаёт hostPath, а этот плагин метрик тома не сообщает
      # (kubelet_volume_stats_* на проде отсутствуют целиком). Свободное место
      # и размеры таблиц даёт только сам CH (asynchronous_metrics).
      - job_name: clickhouse
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [sensitivityscore-system]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: clickhouse
          - source_labels: [__address__]
            action: replace
            regex: ([^:]+)(?::\d+)?
            replacement: $1:9363
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
        metric_relabel_configs:
          # CH отдаёт 2879 семейств (1380 ProfileEvents + 661 код ошибки +
          # 521 Metrics + ...), и почти все — безлейбловые одиночные ряды.
          # Оставить всё = ~6 ГБ TSDB в год ради полутора десятков панелей
          # при потолке хранилища 60 ГБ. Держим закрытый список.
          - source_labels: [__name__]
            action: keep
            regex: ClickHouse(AsyncMetrics_(Disk(Used|Total|Available)_default|TotalBytesOfMergeTreeTables(System)?|TotalPartsOfMergeTreeTables(System)?|MaxPartCountForPartition|LongestRunningMerge|MemoryResident|Uptime)|Metrics_(Query|Merge|MemoryTracking|TCPConnection|HTTPConnection|ReadonlyReplica|BackgroundMergesAndMutationsPoolTask)|ProfileEvents_((Select|Insert|Failed|FailedInsert)?Query|Inserted(Rows|Bytes)|MergedRows|SelectedRows|QueryTimeMicroseconds))

      # --- metrics-agent: оси чувствительности ----------------------------
      # Отдельная job с ЧАСТЫМ интервалом. Причина — разрешение по времени, а
      # не нагрузка: планировщик читает node:metrics:<node> с TTL 30s, и
      # "возраст сэмпла" должен ловить протухание раньше, чем оно случится.
      # При общем интервале 30s наблюдаемый возраст сам по себе доходит до
      # ~35s (время с последнего скрейпа + возраст на момент скрейпа), то
      # есть порог 30s давал бы и ложную тревогу на здоровом стенде, и
      # срабатывание уже ПОСЛЕ потери данных планировщиком. При 10s возраст
      # держится <15s, и порог 30s означает ровно то, что написано на панели.
      # Цель дешёвая: 4 эндпоинта, процессы на узлах уже запущены.
      - job_name: sensitivityscore-metrics-agent
        scrape_interval: 10s
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: sensitivityscore-metrics-agent
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          # Метку node агент проставляет сам (pkg/promexport), поэтому здесь
          # её НЕ трогаем — иначе она превратилась бы в exported_node.

      # --- поды с prometheus.io/scrape ------------------------------------
      # Сюда попадает node-exporter (только ss-system) и то, что уже несёт
      # аннотации от k0s/Calico (kube-proxy, coredns, calico). KSM и
      # metrics-agent сюда НЕ входят — у них свои job'ы выше.
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          # Агент уже покрыт своей job'ой с интервалом 10s — иначе он попал бы
          # в обе и дал бы две серии на узел с разной частотой.
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: drop
            regex: sensitivityscore-metrics-agent
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          # Узел, НА КОТОРОМ крутится под. Для metrics-agent это и есть узел
          # измерения: агент уже проставляет метку node= сам (pkg/promexport),
          # но для node-exporter/KSM метка нужна отсюда.
          - source_labels: [__meta_kubernetes_pod_node_name]
            action: replace
            target_label: instance_node
