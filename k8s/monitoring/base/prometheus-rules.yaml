apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: sensitivityscore-monitoring
data:
  stand.yaml: |
    # Куда это уходит (с 19.08.2026): Alertmanager -> ss-notifier -> Telegram.
    # До того адресата не было вовсе — правила считались, но следом
    # срабатывания была лишь панель в Grafana, то есть узнать о беде можно
    # было, только придя посмотреть. Для серии, которая идёт 4 часа без
    # человека, это не наблюдаемость; поэтому здесь и появился сторожевой
    # SSWatchdog — молчание канала обязано быть отличимо от здоровья.
    #
    # Панель «Активные алерты» на дашборде «Стенд — инфраструктура» осталась и
    # нужна по-прежнему: именно там видно правило, о котором канал сообщить не
    # может (SSAlertDeliveryFailing — поломка самого канала).
    # Смысл этих правил — не «дежурство», а защита от МОЛЧАЛИВО НЕВЕРНЫХ
    # СЕРИЙ: почти всё ниже описывает состояние, при котором стенд продолжает
    # писать цифры, но цифры уже нельзя нести в диссертацию.
    groups:
      - name: sensitivityscore-collection
        rules:
          - alert: SSAgentStale
            # Планировщик читает node:metrics:<node> с TTL 30s. Если агент
            # встал, ключ протухает и Score() работает на пустых данных —
            # молча, без ошибок в логе плагина.
            expr: time() - max by (node) (ss_agent_last_sample_timestamp_seconds) > 60
            for: 1m
            labels: {severity: critical}
            annotations:
              summary: "metrics-agent на {{ $labels.node }} не сэмплирует >60s"
              description: "Redis-ключ node:metrics:{{ $labels.node }} (TTL 30s) протухает — планировщик скорит на пустых данных."

          - alert: SSAgentDown
            # job здесь — sensitivityscore-metrics-agent, а не kubernetes-pods:
            # агент вынесен в свою job (интервал 10s), и прежнее условие по
            # kubernetes-pods+app молча не срабатывало бы никогда.
            expr: max by (node) (up{job="sensitivityscore-metrics-agent"}) == 0
            for: 2m
            labels: {severity: critical}
            annotations:
              summary: "metrics-agent недоступен на {{ $labels.node }}"

          - alert: SSPMUSynthetic
            # Синтетика — режим для dev-бокса. На стенде это значит, что
            # perf_event_open не отдаёт честные счётчики: LLC/NUMA-цифры серии
            # непригодны (docs §1а, perfcheck).
            expr: max by (node) (ss_agent_pmu_hardware_available) == 0
            for: 5m
            labels: {severity: critical}
            annotations:
              summary: "PMU на {{ $labels.node }} нечестный — LLC синтетический"
              description: "Агент свалился в synthetic-devbox. Проверить perf_event_paranoid и CAP_PERFMON (docs §5), прогнать make perfcheck-run NODE={{ $labels.node }}."

          - alert: SSLLCUncalibrated
            # Самая коварная: без калибровки узловой llc_miss_rate — сырой
            # ratio misses/references, который ИНВЕРТИРУЕТСЯ под потоковой
            # нагрузкой (STAGE 2026-07-14: 0.018 под штормом против 0.33 на
            # простое). Дашборд покажет «чистый» узел ровно тогда, когда он
            # максимально загружен.
            expr: max by (node) (ss_agent_llc_calibrated) == 0
            for: 15m
            labels: {severity: warning}
            annotations:
              summary: "LLC-ось на {{ $labels.node }} не откалибрована"
              description: "llc_miss_rate — сырой ratio, инвертируется под нагрузкой. Снять llc_misses_per_sec под 2x stress-ng --stream и выставить LLC_REFERENCE_MISSES_PER_SEC."

          # Зеркало SSLLCUncalibrated: там ось не откалибрована и это видно,
          # здесь калибровка ЕСТЬ, но не от этого железа. Референс со STAGE
          # (15e6 промахов/с на 2 vCPU в KVM) на R760 (2x Xeon 8462Y+, 128
          # потоков) занижен на полтора-два порядка: отношение выходит за
          # единицу, clamp01 прибивает его ровно к 1.0 на КАЖДОМ узле, и ось
          # превращается в константу. В отличие от net_pressure=0, который
          # честно означает «оси нет», насыщенная единица врёт правдоподобной
          # шкалой: агент Running, PMU честный, ss_agent_llc_calibrated=1, на
          # дашборде «высокое давление» — а вклад оси в ранжирование нулевой.
          - alert: SSLLCAxisSaturated
            expr: min by (node) (min_over_time(ss_node_llc_miss_rate[30m])) >= 0.999
            for: 10m
            labels: {severity: critical}
            annotations:
              summary: "LLC-ось на {{ $labels.node }} прибита к насыщению (1.0)"
              description: "llc_miss_rate полчаса не опускался ниже 0.999 — LLC_REFERENCE_MISSES_PER_SEC занижен для этого железа (референс с другого стенда?). Ось не различает узлы. Пересчитать: снять llc_misses_per_sec под 2x stress-ng --stream и make calibration-apply."

          # Мультиплексирование PMU. Когда открытых событий больше, чем
          # физических счётчиков, ядро крутит их по очереди и возвращает
          # СЫРОЕ число, как будто событие считалось всё окно; агент
          # домножает на enabled/running (как perf(1)) и публикует саму долю.
          # Почему это алерт, а не любопытный факт: число открытых событий
          # растёт с числом подов, то есть с нашей экспериментальной
          # переменной — чем плотнее узел, тем сильнее поправка, и смещение
          # оказывается скоррелировано с воздействием. При заметном
          # мультиплексировании числа корректны лишь настолько, насколько
          # верна линейная экстраполяция с доли окна на всё окно.
          - alert: SSPMUMultiplexed
            expr: min by (node) (ss_agent_pmu_multiplex_ratio) < 0.9
            for: 10m
            labels: {severity: warning}
            annotations:
              summary: "PMU на {{ $labels.node }} мультиплексируется ({{ $value | printf \"%.2f\" }})"
              description: "Счётчики простояли на PMU меньше 90% окна. Поправка enabled/running применяется, но НЕ спасает: замер на живом железе показал, что при доле окна 0.58 та же нагрузка оценивается в диапазоне от -3% до +1831% от неискажённого значения — экстраполяция несмещена лишь в среднем, а дисперсия на коротких срезах огромна. Считать это гейтом валидности кэш-оси: пока алерт горит, выводы по llc_* на этом узле недействительны. Лечится только уменьшением числа одновременно открытых событий (меньше подов на узел), а не поправкой."

          # Оси, вырожденные в КОНСТАНТУ (любую, не только 1.0). Аппаратные
          # счётчики не повторяются бит в бит: нулевая дисперсия за час
          # означает не «стабильную нагрузку», а упор в clamp01 сверху либо
          # снизу — то есть ось перестала быть сигналом. Ловит и завышенный
          # референс (всё вжато в ~0), который отдельным порогом не поймать.
          - alert: SSAxisDegenerate
            expr: |
              stddev_over_time(ss_node_llc_miss_rate[1h]) == 0
              and on(node) max by (node) (ss_agent_llc_calibrated) == 1
            for: 15m
            labels: {severity: warning}
            annotations:
              summary: "LLC-ось на {{ $labels.node }} — константа (нулевая дисперсия за час)"
              description: "Значение не меняется вообще: признак упора в clamp01 сверху (референс занижен) или снизу (завышен). Ось не вносит вклада в Score(), но выглядит рабочей."

          - alert: SSNetUncalibrated
            expr: max by (node) (ss_agent_net_calibrated) == 0
            for: 15m
            labels: {severity: warning}
            annotations:
              summary: "Net-ось на {{ $labels.node }} выключена (нет NET_REFERENCE_MBPS)"
              description: "net_pressure=0 честно, но ось не участвует в Score(). make netcheck-run && make netcheck-apply."

          - alert: SSPSIUnavailable
            expr: max by (node) (ss_agent_psi_available) == 0
            for: 15m
            labels: {severity: warning}
            annotations:
              summary: "PSI недоступен на {{ $labels.node }} — IO-ось выключена"
              description: "Нет cgroup io.pressure: ядру нужен psi=1 (docs §5). io_pressure будет нулём, и это не «нет нагрузки»."

          - alert: SSRedisWriteErrors
            expr: sum by (node) (rate(ss_agent_redis_write_errors_total[5m])) > 0
            for: 5m
            labels: {severity: critical}
            annotations:
              summary: "Агент на {{ $labels.node }} не пишет в Redis"
              description: "Горячий путь планировщика и экспорт харнесса теряют данные, даже если /metrics выглядит здоровым."

      - name: sensitivityscore-platform
        rules:
          - alert: SSSystemNodeMemoryLow
            # ss-system на STAGE — 2 ГБ. Здесь живут Redis, планировщик,
            # metrics-server, весь мониторинг и (в планах) ClickHouse.
            # Вытеснение отсюда роняет горячий путь планировщика.
            #
            # job здесь ОБЯЗАТЕЛЕН. С 19.08.2026 node_exporter стоит ещё и на
            # трёх ВМ control-plane (job control-plane-nodes), и без фильтра
            # min() брал бы минимум по всем шести машинам: алерт с текстом
            # «на ss-system» срабатывал бы на контроллере. node-exporter
            # ss-system скрейпится общей job kubernetes-pods (по аннотации).
            expr: min(node_memory_MemAvailable_bytes{job="kubernetes-pods"} / node_memory_MemTotal_bytes{job="kubernetes-pods"}) < 0.15
            for: 5m
            labels: {severity: critical}
            annotations:
              summary: "На ss-system осталось <15% памяти"
              description: "Риск вытеснения Redis/планировщика/Prometheus. Проверить, не приехал ли на узел ClickHouse."

          - alert: SSSystemNodeDiskLow
            # Фильтр по job — по той же причине, что у правила выше.
            expr: node_filesystem_avail_bytes{job="kubernetes-pods", mountpoint="/"} / node_filesystem_size_bytes{job="kubernetes-pods", mountpoint="/"} < 0.15
            for: 10m
            labels: {severity: warning}
            annotations:
              summary: "На ss-system осталось <15% диска"
              description: "TSDB Prometheus лежит в hostPath на этом же диске (40 ГБ на STAGE)."

          - alert: SSPodCrashLooping
            expr: rate(kube_pod_container_status_restarts_total{namespace=~"sensitivityscore-.*"}[15m]) > 0
            for: 5m
            labels: {severity: warning}
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.pod }} перезапускается"

          - alert: SSPodOOMKilled
            expr: kube_pod_container_status_last_terminated_reason{reason="OOMKilled", namespace=~"sensitivityscore-.*"} == 1
            for: 1m
            labels: {severity: critical}
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.pod }} убит по OOM"
              description: "На 2-ГБ ss-system это ожидаемый способ отказа при переуплотнении узла."

          - alert: SSSchedulerDown
            expr: kube_deployment_status_replicas_available{namespace="sensitivityscore-system", deployment="sensitivityscore-scheduler"} < 1
            for: 5m
            labels: {severity: critical}
            annotations:
              summary: "sensitivityscore-scheduler недоступен — поды серии не разложатся"

      # Control plane появился в мониторинге 19.08.2026 (node_exporter на ВМ +
      # открытые слушатели etcd/планировщика/controller-manager). Правил по
      # нему не было ни одного — то есть отказ etcd стенд заметил бы по
      # симптомам («поды не создаются»), а не по причине. Пороги взяты из
      # эксплуатационных ориентиров etcd, а не выдуманы: p99 fsync WAL <10 мс,
      # смены лидера — событие штучное.
      - name: sensitivityscore-control-plane
        rules:
          - alert: SSControllerExporterDown
            # Не «упала ВМ», а «мы перестали о ней знать»: контроллеры k0s
            # работают без kubelet, в kubectl get nodes их нет, и кроме этого
            # экспортёра других свидетельств их состояния у стенда не осталось.
            expr: up{job="control-plane-nodes"} == 0
            for: 5m
            labels: {severity: warning}
            annotations:
              summary: "node_exporter на контроллере {{ $labels.instance }} недоступен"
              description: "Либо ВМ недоступна, либо служба node_exporter не поднялась (роль nodeexporter провизионера)."

          - alert: SSK0sControllerInactive
            expr: node_systemd_unit_state{job="control-plane-nodes", name="k0scontroller.service", state="active"} == 0
            for: 3m
            labels: {severity: critical}
            annotations:
              summary: "k0scontroller на {{ $labels.instance }} не в состоянии active"

          - alert: SSEtcdNoLeader
            # Кворум из трёх: потеря лидера хотя бы одним членом — это уже
            # либо сеть между ВМ, либо диск. Пока лидера нет, apiserver не
            # пишет, то есть поды серии не создаются и не завершаются.
            expr: etcd_server_has_leader == 0
            for: 1m
            labels: {severity: critical}
            annotations:
              summary: "У члена etcd {{ $labels.instance }} нет лидера"

          - alert: SSEtcdLeaderChurn
            expr: increase(etcd_server_leader_changes_seen_total[1h]) > 3
            labels: {severity: warning}
            annotations:
              summary: "etcd сменил лидера >3 раз за час"
              description: "Обычно это медленный диск или сетевые таймауты между ВМ. Смотреть fsync WAL на дашборде control plane."

          - alert: SSEtcdSlowFsync
            # 10 мс — ориентир самого etcd. На проде 19.08.2026 наблюдалось
            # 1.96 мс, то есть запас пятикратный: срабатывание означает
            # реальную деградацию диска ВМ, а не «порог впритык».
            expr: histogram_quantile(0.99, sum by (instance, le) (rate(etcd_disk_wal_fsync_duration_seconds_bucket[5m]))) > 0.01
            for: 10m
            labels: {severity: warning}
            annotations:
              summary: "etcd на {{ $labels.instance }}: fsync WAL p99 > 10 мс"
              description: "Диск ВМ не успевает за журналом. Кампанию это тормозит на создании/завершении подов, а не на счёте."

          - alert: SSEtcdQuotaNear
            expr: etcd_mvcc_db_total_size_in_bytes / etcd_server_quota_backend_bytes > 0.8
            for: 15m
            labels: {severity: warning}
            annotations:
              summary: "БД etcd заняла >80% квоты на {{ $labels.instance }}"
              description: "При достижении квоты кластер уходит в режим только-чтение. Лечится compaction+defrag."

          - alert: SSApiserverErrors
            expr: sum(rate(apiserver_request_total{code=~"5.."}[5m])) / sum(rate(apiserver_request_total[5m])) > 0.02
            for: 10m
            labels: {severity: warning}
            annotations:
              summary: "apiserver отдаёт >2% ответов 5xx"

      # Хранилище и энергия — две подсистемы, отказ которых НЕ виден по
      # состоянию подов: CH может быть Running и при этом не принимать
      # вставки, а pushgateway помнит последнее значение мощности вечно.
      - name: sensitivityscore-storage-energy
        rules:
          - alert: SSClickHouseDown
            expr: up{job="clickhouse"} == 0
            for: 5m
            labels: {severity: critical}
            annotations:
              summary: "ClickHouse недоступен — результаты кампании некуда складывать"

          - alert: SSClickHouseInsertsFailing
            # Отказ вставки = потерянная точка серии. Харнесс пишет результат
            # один раз и дальше идёт к следующей точке.
            expr: increase(ClickHouseProfileEvents_FailedInsertQuery[15m]) > 0
            labels: {severity: critical}
            annotations:
              summary: "ClickHouse отбивает вставки"
              description: "Строки результатов не доезжают. Смотреть system.errors и место на диске ss-system."

          - alert: SSClickHouseTooManyParts
            # Классический предвестник отказа вставок в MergeTree: слияния не
            # успевают за вставками, и при ~300 кусках на партицию CH начинает
            # отбивать INSERT'ы. Порог с запасом — чинить надо заранее.
            expr: ClickHouseAsyncMetrics_MaxPartCountForPartition > 200
            for: 10m
            labels: {severity: warning}
            annotations:
              summary: "ClickHouse: {{ $value }} кусков в партиции"

          - alert: SSClickHouseSystemLogsFat
            # Тонкость размещения: том CH — local-path, то есть hostPath, и
            # запрошенные 5Gi НЕ ограничивают ничего — CH видит весь 100-ГБ
            # диск ss-system, где рядом лежит TSDB Prometheus. Системные
            # таблицы самого CH (query_log, trace_log, part_log) растут без
            # TTL и на 19.08.2026 занимали 93 МБ из 93 МБ всех MergeTree —
            # то есть данные исследования на их фоне почти невидимы. Правило
            # ловит момент, когда журналы CH начинают отъедать общий диск.
            expr: ClickHouseAsyncMetrics_TotalBytesOfMergeTreeTablesSystem > 5e9
            for: 30m
            labels: {severity: warning}
            annotations:
              summary: "Системные таблицы ClickHouse заняли >5 ГБ"
              description: "Это журналы самого CH, а не результаты. Лечится TTL на system.*_log либо TRUNCATE."

          - alert: SSEnergyPollStale
            # Именно этот случай и маскирует pushgateway: он продолжает
            # отдавать последнее значение, панель «мощность» выглядит живой,
            # а окна энергии считаются по данным, которых уже нет.
            expr: time() - max(idrac_poll_timestamp_seconds) > 300
            for: 2m
            labels: {severity: warning}
            annotations:
              summary: "Поллер iDRAC молчит >5 минут"
              description: "Метрики мощности в pushgateway протухли, но продолжают отдаваться. Смотреть Deployment idrac-poller."

      # Самоконтроль сбора. Не про стенд, а про мониторинг: метрик etcd не
      # было месяцами, и ни одно правило об этом не сообщало, потому что
      # «нет метрики» — это не «метрика плохая». Ловушка общая: любое
      # молчание цели делает соответствующие панели пустыми, а алерты по ним
      # — вечно неактивными, что неотличимо от «всё хорошо».
      - name: sensitivityscore-monitoring-self
        rules:
          - alert: SSTargetDown
            # Универсальное правило поверх всех job: адресные (SSAgentDown,
            # SSControllerExporterDown, SSClickHouseDown) остаются — у них
            # свои пороги и текст; это ловит всё остальное, включая цели,
            # добавленные позже и забытые.
            expr: up == 0
            for: 10m
            labels: {severity: warning}
            annotations:
              summary: "Цель {{ $labels.job }} / {{ $labels.instance }} недоступна >10 минут"

          - alert: SSWatchdog
            # Единственное правило, которое срабатывает ВСЕГДА, и это его
            # смысл. Оно закрывает дыру, из-за которой ss-notifier вообще
            # появился: отсутствие уведомлений выглядит ровно как «всё
            # хорошо». Alertmanager отправляет его раз в 12 часов (отдельный
            # маршрут ss-notifier-heartbeat); два сообщения в сутки означают
            # «Prometheus жив, правила вычисляются, канал доставки работает».
            # Их ПРОПАЖА — это и есть сигнал: молчание стало отличимо от
            # здоровья. severity намеренно не critical и не warning, иначе
            # оно попало бы в маршрут критичных и приходило бы каждый час.
            expr: vector(1)
            labels: {severity: heartbeat}
            annotations:
              summary: "стенд на связи: правила вычисляются, доставка работает"
              description: "Это регулярный признак жизни, а не беда. Если он перестал приходить — сломался Prometheus, Alertmanager или канал ss-notifier."

          - alert: SSAlertDeliveryFailing
            # Кто сторожит сторожа. Счётчик растёт и когда недоступен
            # ss-notifier, и когда он доступен, но не смог отправить в канал
            # (тогда он отдаёт 502) — то есть правило покрывает весь путь до
            # Telegram, включая обход блокировки адреса api.telegram.org
            # (overlays/prod/ss-notifier-prod-patch.yaml).
            #
            # ОГОВОРКА, которую надо помнить: доехать в канал это правило по
            # понятной причине не может. Смотреть его — на панели «Активные
            # алерты» дашборда «Стенд — инфраструктура».
            expr: increase(alertmanager_notifications_failed_total[30m]) > 0
            for: 5m
            labels: {severity: warning}
            annotations:
              summary: "Alertmanager не смог доставить уведомление ({{ $labels.integration }})"
              description: "Алерты стенда сейчас никуда не приходят. Проверить под ss-notifier и достижимость api.telegram.org из кластера; запасной канал — ntfy (SS_NOTIFY_BACKEND в Secret ss-notifier-config)."

          - alert: SSPrometheusStorageFilling
            # TSDB лежит в hostPath на диске ss-system; retention на проде —
            # 365 дней при потолке 60 ГБ. Правило предупреждает раньше, чем
            # retention.size начнёт молча удалять СТАРЫЕ блоки — то есть
            # ранние серии кампании.
            expr: prometheus_tsdb_storage_blocks_bytes / 1024 / 1024 / 1024 > 45
            for: 30m
            labels: {severity: warning}
            annotations:
              summary: "TSDB Prometheus занял >45 ГБ"
              description: "На 60 ГБ включится retention.size и начнёт удалять самые старые блоки — это история первых серий."
