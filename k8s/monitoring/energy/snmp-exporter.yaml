# snmp_exporter — опрос PDU стойки. ЗАГОТОВКА фазы P0: не включена в
# kustomization, см. README.md рядом.
#
# Модель известна (Д1 закрыт 19.08.2026): 2× APC AP8853, Rack PDU 2G
# METERED — учёт по входу и двум банкам, per-outlet НЕТ. PDU — агрегат
# стойки, не пер-узловой источник; сервера запитаны от ОБЕИХ PDU (A/B,
# PS1+PS2) — в Prometheus обе идут отдельными целями с меткой pdu, энергию
# суммирует потребитель (p0-crossval.py так и делает).
#
# Модуль apc_rpdu2 написан РУКАМИ по PowerNet-MIB (таблицы rPDU2): OID ниже
# СВЕРИТЬ snmpwalk'ом при первом подключении (snmp-пакет на лабе стоит):
#   snmpwalk -v2c -c <community> <PDU_IP> 1.3.6.1.4.1.318.1.1.26.4.3.1
# Апстрим-generator из MIB — законная альтернатива, но ради четырёх веток
# OID тянуть его конвейер незачем.
#
# ЕДИНИЦЫ rPDU2 (проверить по walk'у!): мощность устройства — СОТЫЕ кВт
# (=10 Вт), энергия — ДЕСЯТЫЕ кВт·ч (шаг 0.1 кВт·ч = 360 кДж), токи —
# десятые ампера. snmp_exporter не умеет масштабировать — раскодировка на
# потребителе: energy-window.py / p0-crossval.py для pdu_device_energy
# требуют --pdu-factor 3.6e5 (десятые кВт·ч → джоули), НЕ дефолтные 3.6e6.
#
# TODO(Д2): IP обеих PDU + SNMP RO community; проверить, виден ли адрес из
#   VM-сетей (как у iDRAC), и НЕТ ли каскада (Network Port Sharing меняет
#   адресацию юнитов в SNMP — тогда цели и индексы пересобрать).
# TODO(Д3): карта PS1/PS2↔розетка/банк по КАЖДОЙ PDU + чужие потребители на
#   банках; чистота банков включает вердикт Э0.1 (--clean-banks).
#
# Community в git не живёт: auths — отдельным файлом из Secret, второй
# --config.file (снятие: v0.25+ умеет несколько конфигов через запятую).
# Создание секрета (файл держать вне репо):
#   printf 'auths:\n  pdu_ro:\n    community: <RO_COMMUNITY>\n    version: 2\n' > /tmp/pdu-auth.yml
#   kubectl -n sensitivityscore-monitoring create secret generic snmp-exporter-auth \
#     --from-file=auth.yml=/tmp/pdu-auth.yml && rm /tmp/pdu-auth.yml
#
# Снипет scrape-джоба для prometheus-configmap (добавить при включении;
# метка pdu различает стойки A/B — ИМЕНА уточнить по карте Д3):
#   - job_name: pdu
#     metrics_path: /snmp
#     params: {module: [apc_rpdu2], auth: [pdu_ro]}
#     static_configs:
#       - {targets: ['<PDU_A_IP>'], labels: {pdu: a}}
#       - {targets: ['<PDU_B_IP>'], labels: {pdu: b}}
#     relabel_configs:
#       - {source_labels: [__address__], target_label: __param_target}
#       - {source_labels: [__param_target], target_label: instance}
#       - {target_label: __address__, replacement: snmp-exporter.sensitivityscore-monitoring.svc:9116}
apiVersion: v1
kind: ConfigMap
metadata:
  name: snmp-exporter-config
  namespace: sensitivityscore-monitoring
  labels: {app: snmp-exporter}
data:
  snmp.yml: |
    modules:
      apc_rpdu2:
        walk:
          - 1.3.6.1.4.1.318.1.1.26.4.3.1   # rPDU2DeviceStatusTable
          - 1.3.6.1.4.1.318.1.1.26.6.3.1   # rPDU2PhaseStatusTable
          - 1.3.6.1.4.1.318.1.1.26.8.3.1   # rPDU2BankStatusTable
        metrics:
          # Мощность устройства, сотые кВт (rPDU2DeviceStatusPower).
          - name: pdu_device_power_centikw
            oid: 1.3.6.1.4.1.318.1.1.26.4.3.1.5
            type: gauge
            indexes: [{labelname: unit, type: gauge}]
          # Накопительная энергия устройства, десятые кВт·ч
          # (rPDU2DeviceStatusEnergy) — НАКОПИТЕЛЬНЫЙ РЕГИСТР, точка правды
          # энергоокон; --pdu-factor 3.6e5.
          - name: pdu_device_energy_decikwh
            oid: 1.3.6.1.4.1.318.1.1.26.4.3.1.9
            type: counter
            indexes: [{labelname: unit, type: gauge}]
          # Ток фазы, десятые ампера (rPDU2PhaseStatusCurrent).
          - name: pdu_phase_current_deciamp
            oid: 1.3.6.1.4.1.318.1.1.26.6.3.1.5
            type: gauge
            indexes: [{labelname: phase, type: gauge}]
          # Ток банка, десятые ампера (rPDU2BankStatusCurrent) — перегруз
          # банка 16А виден отсюда.
          - name: pdu_bank_current_deciamp
            oid: 1.3.6.1.4.1.318.1.1.26.8.3.1.5
            type: gauge
            indexes: [{labelname: bank, type: gauge}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snmp-exporter
  namespace: sensitivityscore-monitoring
  labels: {app: snmp-exporter}
spec:
  replicas: 1
  selector:
    matchLabels: {app: snmp-exporter}
  template:
    metadata:
      labels: {app: snmp-exporter}
    spec:
      containers:
        - name: snmp-exporter
          image: prom/snmp-exporter:v0.26.0
          args:
            - --config.file=/etc/snmp_exporter/snmp.yml,/etc/snmp_exporter_auth/auth.yml
          ports:
            - containerPort: 9116
          volumeMounts:
            - {name: config, mountPath: /etc/snmp_exporter}
            - {name: auth, mountPath: /etc/snmp_exporter_auth}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
      volumes:
        - name: config
          configMap:
            name: snmp-exporter-config
        - name: auth
          secret:
            secretName: snmp-exporter-auth   # см. шапку: community не в git
---
apiVersion: v1
kind: Service
metadata:
  name: snmp-exporter
  namespace: sensitivityscore-monitoring
spec:
  selector: {app: snmp-exporter}
  ports:
    - port: 9116
      targetPort: 9116
