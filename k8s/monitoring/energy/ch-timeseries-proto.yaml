# ЛАБА local72: фидер прототипа «сырые ряды в точке правды».
# Миниатюрный Prometheus (самоскрейп как источник рядов) пишет remote_write
# в ОСНОВНОЙ харнессный ClickHouse (clickhouse.sensitivityscore-system:9363,
# форма handlers — k8s/clickhouse/base/config.yaml, таблица default.prom_ts
# из миграции 006). Первая итерация прототипа жила с отдельным CH в этом же
# файле (20.08.2026) и снесена после объединения с основным кликом; выводы
# обкатки — в README.md рядом. НА ПРОД не применять: там фидером станет
# штатный Prometheus мониторинга (remote_write в его конфиг — после Ш-фаз).
# Снос: kubectl delete ns ts-proto.
apiVersion: v1
kind: Namespace
metadata:
  name: ts-proto
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prom-ts-config
  namespace: ts-proto
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: self          # источник рядов для прототипа — сам Prometheus
        static_configs:
          - targets: ["localhost:9090"]
    remote_write:
      - url: http://clickhouse.sensitivityscore-system.svc.cluster.local:9363/write
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prom-ts
  namespace: ts-proto
spec:
  replicas: 1
  selector: {matchLabels: {app: prom-ts}}
  template:
    metadata: {labels: {app: prom-ts}}
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2h"]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 384Mi}
          volumeMounts:
            - {name: cfg, mountPath: /etc/prometheus}
      volumes:
        - name: cfg
          configMap: {name: prom-ts-config}
